spring:
  config:
    activate:
      on-profile: dev
  flyway:
    enabled: true
    baseline-on-migrate: true
  devtools:
    add-properties: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: postgres
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  kafka:
    bootstrap-servers: localhost:29092
  redis:
    host: 127.0.0.1
    port: 6379
logging:
  level:
    org.springframework.security: TRACE
sendgrid:
  api-key: ${SENDGRID_API_KEY}
  from-email: ${SENDGRID_FROM_EMAIL}
  template-id: ${SENDGRID_TEMPLATE_ID:d-a52ec2a1f7a84f06a2e08bbe9cae3215}
  order-status-template-id: d-5cd1cc21e7f547c98aa5326813d689aa
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
openapi:
  service:
    api-docs: backend-service
    serverUrl: http://localhost:${server.port}
    serverName: Backend Ecommerce
    title: API Document
    version: 1.0.0

jwt:
  expiryHour: 1
