spring:
  config:
    activate:
      on-profile: dev
  flyway:
    enabled: true
    baseline-on-migrate: true
  devtools:
    add-properties: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: postgres
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:29092
  redis:
    host: 127.0.0.1
    port: 6379

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
openapi:
  service:
    api-docs: backend-service
    serverUrl: http://localhost:${server.port}
    serverName: Backend Ecommerce
    title: API Document
    version: 1.0.0
  sendGrid:
    apiKey: ${SENDGRID_API_KEY:DUMMY-SENDGRID-API-KEY}
    fromEmail: ${SENDGRID_FROM_EMAIL:quoctay87@gmail.com}
    templateId: ${SENDGRID_TEMPLATE_ID:d-2116466afd0a438b90615184dd569e42}
    verificationLink: ${SENDGRID_VERIFICATION_LINK:http://localhost:8080/user/confirm-email}

